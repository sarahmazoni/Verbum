{% load static %}
 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Recuperar senha | VERBUM</title>
 
    <link rel="stylesheet" href="{% static 'css/verbum.css' %}">
</head>
 
<body>
 
    <main class="login-layout">
 
        <section class="login-area">
 
            <form class="login-card" method="post">
 
                {% csrf_token %}
 
                <p class="tag">RECUPERAÇÃO DE SENHA</p>
 
                <h2>Esqueceu sua senha?</h2>
 
                <p class="subtext">
                    Informe seu e-mail e enviaremos as instruções para criar uma nova senha.
</p>
 
                {{ form.email.errors }}
 
                <label for="id_email">E-mail</label>
 
                <input
                    id="id_email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="seuemail@exemplo.com"
                    required
>
 
                <button class="button-primary" type="submit">
                    Enviar instruções
</button>
 
                <p class="register">
<a href="{% url 'login' %}">Voltar para o login</a>
</p>
 
            </form>
 
        </section>
 
    </main>
 
</body>
</html>
