<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
<meta charset="UTF-8">
<title>Verificação 2FA</title>
</head>
 
<body>
 
    <h1>Autenticação em dois fatores</h1>
 
    <p>
        Digite o código de 6 dígitos gerado pelo seu aplicativo autenticador.
</p>
 
    {% if error %}
<p>{{ error }}</p>
    {% endif %}
 
    <form method="post">
 
        {% csrf_token %}
 
        <label for="codigo">
            Código:
</label>
 
        <input
            id="codigo"
            name="codigo"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            required
>
 
        <button type="submit">
            Verificar
</button>
 
    </form>
 
</body>
 
</html>
